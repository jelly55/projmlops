name: Feature CI

on:
  pull_request:
    branches: [dev]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint (syntax)
        run: python -m compileall .
      - name: Unit tests (placeholder)
        run: echo "add tests here" && exit 0
