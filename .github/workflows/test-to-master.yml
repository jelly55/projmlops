name: Test to Master - Build & Push

on:
  pull_request:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Preinstall uvicorn to avoid bad metadata
        run: pip install "uvicorn[standard]==0.23.2" "python-dotenv==1.0.1"
      - name: Build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-api:${{ github.sha }} -f serve/Dockerfile .
      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-api:${{ github.sha }}
      - name: Smoke test
        run: |
          docker run -d --rm --name weather-api-test -p 8000:8000 \
            -e MLFLOW_TRACKING_URI \
            -e MLFLOW_TRACKING_USERNAME \
            -e MLFLOW_TRACKING_PASSWORD \
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-api:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/health
          docker stop weather-api-test
