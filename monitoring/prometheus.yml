global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'weather-mlops-monitor'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files for alerting
rule_files:
  # - "alert_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Weather Prediction API
  - job_name: 'weather-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['weather-api:8000']
        labels:
          service: 'weather-prediction-api'
          environment: 'production'
          version: '1.0.0'
